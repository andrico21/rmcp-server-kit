# Contradiction override: rustc `unreachable_pub` (denied above) and nursery's
# `redundant_pub_crate` give opposite advice on `pub(crate)`; rustc's wins.
redundant_pub_crate = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
