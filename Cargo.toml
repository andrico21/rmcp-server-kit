[package]
name = "rmcp-server-kit"
version = "3.14.3"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
description = "Reusable MCP server framework with auth, RBAC, and Streamable HTTP transport (built on the rmcp SDK)"
readme = "README.md"
repository = "https://github.com/andrico21/rmcp-server-kit"
documentation = "https://docs.rs/rmcp-server-kit"
keywords = ["mcp", "rmcp", "server", "oauth", "rbac"]
categories = [
  "network-programming",
  "web-programming::http-server",
  "authentication",
]
authors = ["rmcp-server-kit contributors"]
exclude = [
  "target/",
  "flycheck0/",
  "tmp/",
  "tests/artifacts/",
  ".github/",
  ".gitlab-ci.yml",
  # Committed warnings policy, not meant for the published crate.
  ".cargo/config.toml",
  # Agent planning scratchpads. Untracked, so a clean CI checkout never sees
  # them, but `cargo publish --allow-dirty` from a working tree would package
  # them -- they contain internal review notes and session identifiers.
  ".omo/",
  ".sisyphus/",
  # Development-only guideline docs. The root file is the vendoring index; the
  # rules themselves are vendored under docs/rust-guidelines/.
  "RUST_GUIDELINES.md",
  "docs/rust-guidelines/",
]

[lib]
name = "rmcp_server_kit"
path = "src/lib.rs"

[[example]]
name = "oauth_server"
required-features = ["oauth"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# MCP Protocol - official Rust SDK
rmcp = { version = "3", features = [
  "server",
  "transport-streamable-http-server",
  "transport-io",
  "macros",
] }

# Async runtime
tokio = { version = "1", features = [
  "net",
  "signal",
  "macros",
  "rt",
  "fs",
  "sync",
] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP server
axum = { version = "0.8" }
tower = { version = "0.5", features = [
  "util",
  "timeout",
  "limit",
  "load-shed",
] }
tower-http = { version = "0.7", features = [
  "trace",
  "cors",
  "limit",
  "timeout",
  "set-header",
  "compression-gzip",
  "compression-br",
] }
http-body-util = "0.1"

# TLS
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
] }
x509-parser = "0.18"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "json",
  "fmt",
] }

# Security
argon2 = { version = "0.6", features = ["password-hash"] }
subtle = "2"
governor = "0.10"
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.10"
hmac = "0.13"
sha2 = "0.11"

# Lock-free pointer swap for hot-reload
arc-swap = "1"

# CIDR parsing/matching for the trusted-proxy allowlist (trusted-forwarder
# mode). Hand-rolling CIDR logic - especially IPv6 - is riskier than the
# dependency.
ipnet = "2"

# Utilities
humantime = "2"
humantime-serde = "1"
secrecy = { version = "0.10", features = ["serde"] }
url = "2"
# POSIX-shell-like lexical splitting for RBAC argument-allowlist matching.
# On the 2.x line: 2.0 only *removed* the deprecated quote/join APIs
# (subject of RUSTSEC-2024-0006 / CVE-2024-58266) and an unsound DerefMut
# impl. We consume only `shlex::split`, whose behaviour is unchanged from
# the fully-patched 1.3 line, so 2.x is security- and behaviour-equivalent
# here while collapsing the duplicate shlex copy pulled in transitively.
shlex = "2"

# Metrics (optional)
prometheus = { version = "0.14", optional = true }

# OAuth 2.1 JWT (optional)
jsonwebtoken = { version = "11", features = ["rust_crypto"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls-no-provider",
  "json",
] }
urlencoding = { version = "2", optional = true }

# Windows-only: owner-only ACLs for the audit log.
#
# Unix applies 0o600 at creation via OpenOptionsExt::mode. Windows has no safe
# creation-time equivalent -- std cannot pass SECURITY_ATTRIBUTES to file
# creation (rust-lang/libs-team#324) -- so the DACL is applied immediately
# after creation. This crate is used ONLY for current_process_sid() and
# applying a protected owner-only DACL; its unsafe Win32 calls are
# encapsulated, which is required because this crate is #![forbid(unsafe_code)].
[target.'cfg(windows)'.dependencies]
windows-permissions = "0.2.4"

[features]
default = []
oauth = ["dep:jsonwebtoken", "dep:urlencoding"]
oauth-mtls-client = ["oauth"]
metrics = ["dep:prometheus"]
# Test-only helpers from mtls_revocation and oauth for downstream integration
# tests. never enable in a production build: some helpers deliberately bypass
# SSRF screening, the JWKS refresh cooldown, the CDP discovery rate limiter,
# and CRL verifier publication.
test-helpers = []

[dev-dependencies]
rcgen = "0.14"
rsa = "0.9"
wiremock = "0.6"
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls-no-provider",
  "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
memory-stats = "1"
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }
proptest = "1"
temp-env = "0.3.6"
async-trait = "0.1"
futures = "0.3"

[[bench]]
name = "rbac_redaction"
harness = false

[[bench]]
name = "hook_latency"
harness = false

[[bench]]
name = "crl_precheck"
harness = false
required-features = ["test-helpers"]

# Tiered test targets. One `[[test]]` per file so the target name stays the
# bare file stem (`--test e2e`, `--test docs_citations`, ...). `required-features`
# replaces the crate-level `#![cfg(feature = ...)]` gates the moved files used
# to carry: running a gated target without its features now errors with
# "requires the features" instead of silently running an empty binary.
[[test]]
name = "crl_discovery_ratelimit"
path = "tests/unit/crl_discovery_ratelimit.rs"

[[test]]
name = "crl_h3_regression"
path = "tests/unit/crl_h3_regression.rs"
required-features = ["test-helpers"]

[[test]]
name = "crl_map_bounds"
path = "tests/unit/crl_map_bounds.rs"
required-features = ["test-helpers"]

[[test]]
name = "oauth_url_validation"
path = "tests/unit/oauth_url_validation.rs"
required-features = ["oauth"]

[[test]]
name = "properties"
path = "tests/unit/properties.rs"

[[test]]
name = "crl_ssrf"
path = "tests/integration/crl_ssrf.rs"

[[test]]
name = "delegation_guard"
path = "tests/integration/delegation_guard.rs"

[[test]]
name = "docs_citations"
path = "tests/integration/docs_citations.rs"

[[test]]
name = "e2e"
path = "tests/integration/e2e.rs"

[[test]]
name = "e2e_oauth_mtls"
path = "tests/integration/e2e_oauth_mtls.rs"
required-features = ["oauth", "oauth-mtls-client", "test-helpers"]

[[test]]
name = "jwks_key_cap"
path = "tests/integration/jwks_key_cap.rs"
required-features = ["oauth", "test-helpers"]

[[test]]
name = "jwks_redirect_ssrf"
path = "tests/integration/jwks_redirect_ssrf.rs"
required-features = ["oauth", "test-helpers"]

[[test]]
name = "limiter_memory"
path = "tests/integration/limiter_memory.rs"

[[test]]
name = "metrics_handle"
path = "tests/integration/metrics_handle.rs"
required-features = ["metrics"]

[[test]]
name = "metrics_headers"
path = "tests/integration/metrics_headers.rs"
required-features = ["metrics"]

[[test]]
name = "oauth_http_client"
path = "tests/integration/oauth_http_client.rs"
required-features = ["oauth", "test-helpers"]

[[test]]
name = "origin_validation"
path = "tests/integration/origin_validation.rs"

[[test]]
name = "ssrf_resolver"
path = "tests/integration/ssrf_resolver.rs"
required-features = ["oauth", "test-helpers"]

# cargo-machete config: dependencies machete cannot detect via static
# analysis but that ARE used at runtime.
#
# - humantime-serde: used as `#[serde(with = "humantime_serde")]` attribute
#   path in src/auth.rs (machete does not follow `serde(with = ...)` paths).
# - subtle: kept as a direct dependency for constant-time comparison
#   primitives; currently consumed transitively via argon2 / password-hash
#   but we want a stable direct version pin available for future use in
#   custom auth helpers.
[package.metadata.cargo-machete]
ignored = ["humantime-serde", "subtle"]

[lints.rust]
# Every rustc lint group, at deny (individual entries below override at priority 0)
future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2018_compatibility = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }
keyword_idents = { level = "warn", priority = -1 }
refining_impl_trait = { level = "warn", priority = -1 }
deprecated_safe = { level = "warn", priority = -1 }
unknown_or_malformed_diagnostic_attributes = { level = "warn", priority = -1 }
# Overridable only by the unsafe-ffi overlay
unsafe_code = "warn"
# Every allow-by-default rustc lint available on stable, plus warn-by-default ones made explicit
absolute_paths_not_starting_with_crate = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
confusable_idents = "warn"
dead_code_pub_in_binary = "warn"
deprecated_in_future = "warn"
deprecated_safe_2024 = "warn"
deref_into_dyn_supertrait = "warn"
edition_2024_expr_fragment_specifier = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "warn"
if_let_rescope = "warn"
impl_trait_overcaptures = "warn"
impl_trait_redundant_captures = "warn"
keyword_idents_2018 = "warn"
keyword_idents_2024 = "warn"
let_underscore_drop = "warn"
linker_messages = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
missing_unsafe_on_extern = "warn"
mixed_script_confusables = "warn"
non_ascii_idents = "warn"
raw_borrows_via_references = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
renamed_and_removed_lints = "warn"
rust_2021_incompatible_closure_captures = "warn"
rust_2021_incompatible_or_patterns = "warn"
rust_2021_prefixes_incompatible_syntax = "warn"
rust_2021_prelude_collisions = "warn"
rust_2024_guarded_string_incompatible_syntax = "warn"
rust_2024_incompatible_pat = "warn"
rust_2024_prelude_collisions = "warn"
single_use_lifetimes = "warn"
tail_expr_drop_order = "warn"
text_direction_codepoint_in_comment = "warn"
text_direction_codepoint_in_literal = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
uncommon_codepoints = "warn"
unexpected_cfgs = "warn"
unit_bindings = "warn"
unknown_lints = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_attr_outside_unsafe = "warn"
unsafe_op_in_unsafe_fn = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

[lints.rustdoc]
all = { level = "warn", priority = -1 }

[lints.clippy]
# Every Clippy group
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Every `restriction` lint except the documented exclusions (120 of 135)
absolute_paths = "warn"
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
as_pointer_underscore = "warn"
as_underscore = "warn"
assertions_on_result_states = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
create_dir = "warn"
dbg_macro = "warn"
decimal_literal_representation = "warn"
default_numeric_fallback = "warn"
default_union_representation = "warn"
definition_in_module_root = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
doc_include_without_cfg = "warn"
doc_paragraphs_missing_punctuation = "warn"
else_if_without_else = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
exit = "warn"
expect_used = "warn"
field_scoped_visibility_modifiers = "warn"
filetype_is_file = "warn"
float_arithmetic = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
host_endian_bytes = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
inline_asm_x86_att_syntax = "warn"
inline_modules = "warn"
inline_trait_bounds = "warn"
integer_division = "warn"
integer_division_remainder_used = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
map_with_unused_argument_over_ranges = "warn"
