# Toolchain-driven deltas between the vendored core Section 9 profile and
# Cargo.toml (D-14 iii).  Empty at the start; entries are added only by the
# toolchain-drift procedure, each with the toolchain version that requires it.
#
# [[rename]]
# from = "clippy::old_lint"
# to = "clippy::new_lint"
# toolchain = "1.100"
#
# [[removed]]
# lint = "clippy::gone_lint"
# toolchain = "1.100"
#
# [[level]]
# lint = "clippy::some_lint"
# level = "warn"
# toolchain = "1.100"
#
# ``profile_eq.py`` reads this file to compare Cargo.toml against the vendored
# profile modulo these recorded deltas. (The retired ``measure.py``/count gate
# also consulted ``from``/``lint`` names; nothing does now.)
