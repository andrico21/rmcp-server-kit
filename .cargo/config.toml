# Deny all rustc warnings for local packages. This replaces CI's global
# `RUSTFLAGS="-D warnings"`: unlike RUSTFLAGS it does not invalidate the build
# cache, and it covers every local package (a warning in a vendored path
# dependency fails the build too). Toggle per-invocation for local WIP with
# `CARGO_BUILD_WARNINGS=allow` (see CONTRIBUTING.md).
[build]
warnings = "deny"
